name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      # No step in this job pushes, so the checkout token is not left in
      # .git/config while dependency lifecycle scripts run.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No `version` input: package.json's packageManager field is the
      # single source of truth, and pnpm/action-setup rejects both at once.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `prepare` builds the package, so this also proves a clean checkout can
      # produce the files the manifest promises.
      - run: pnpm install --frozen-lockfile

      # `prepublishOnly` repeats these three during publish. Running them here
      # fails earlier, with clearer output, and before anything is uploaded.
      - run: pnpm run typecheck
      - run: pnpm test

      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi

      - run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
